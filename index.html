const { useState, useEffect, useRef } = React;

/* ── Intersection observer hook ── */
function useVisible(threshold = 0.15) {
  const ref = useRef(null);
  const [v, setV] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(
      ([e]) => { if (e.isIntersecting) setV(true); },
      { threshold }
    );
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, v];
}

/* ── Animated counter ── */
function Counter({ to, suf = '', dur = 2000 }) {
  const [n, setN] = useState(0);
  const [ref, v] = useVisible();
  useEffect(() => {
    if (!v) return;
    let c = 0;
    const step = to / (dur / 16);
    const t = setInterval(() => {
      c += step;
      if (c >= to) { setN(to); clearInterval(t); }
      else setN(Math.floor(c));
    }, 16);
    return () => clearInterval(t);
  }, [v, to, dur]);
  return <span ref={ref}>{n.toLocaleString('en-IN')}{suf}</span>;
}

                    <option>Rent</option>
                    <option>Invest</option>
                  </select>
                </div>
                <div>
                  <label style={{ color: '#9ca3af', fontSize: '0.8rem', fontWeight: 600, display: 'block', marginBottom: '8px', letterSpacing: '0.05em' }}>BUDGET / PROPERTY TYPE</label>
                  <input
                    value={form.budget} onChange={e => set('budget', e.target.value)}
                    placeholder="e.g. 1 Cr – 2 Cr / 3BHK"
                    style={{
                      width: '100%', background: '#111827', border: '1px solid rgba(255,255,255,0.1)',
                      borderRadius: '10px', color: 'white', padding: '12px 16px', fontSize: '0.95rem',
                      fontFamily: 'Inter, sans-serif', transition: 'border-color 0.2s',
                    }}
                  />
                </div>
              </div>

              <div style={{ marginBottom: '28px' }}>
                <label style={{ color: '#9ca3af', fontSize: '0.8rem', fontWeight: 600, display: 'block', marginBottom: '8px', letterSpacing: '0.05em' }}>MESSAGE</label>
                <textarea
                  value={form.message} onChange={e => set('message', e.target.value)}
                  placeholder="Tell us more about your requirements..."
                  rows={4}
                  style={{
                    width: '100%', background: '#111827', border: '1px solid rgba(255,255,255,0.1)',
                    borderRadius: '10px', color: 'white', padding: '12px 16px', fontSize: '0.95rem',
                    fontFamily: 'Inter, sans-serif', resize: 'vertical', transition: 'border-color 0.2s',
                  }}
                />
              </div>

              <button
                type="submit"
                style={{
                  width: '100%', padding: '16px', borderRadius: '12px',
                  background: 'linear-gradient(135deg, #f59e0b, #fbbf24)',
                  color: '#0a0a1a', fontWeight: 800, fontSize: '1rem',
                  border: 'none', cursor: 'pointer', transition: 'opacity 0.2s, transform 0.2s',
                  letterSpacing: '0.03em', fontFamily: 'Inter, sans-serif',
                }}
                onMouseEnter={e => { e.target.style.opacity = '0.92'; e.target.style.transform = 'scale(1.01)'; }}
                onMouseLeave={e => { e.target.style.opacity = '1'; e.target.style.transform = 'scale(1)'; }}
              >
                Request Free Consultation
              </button>
            </form>
          )}
        </div>
      </div>
    </section>
  );
}
